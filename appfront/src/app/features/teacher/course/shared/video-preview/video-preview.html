<div
  class="video-preview-container h-full w-full flex flex-col relative bg-[#111111] rounded-2xl overflow-hidden shadow-xl ring-1 ring-gray-200">

  <!-- Encabezado sutil -->
  <div
    class="absolute top-0 left-0 w-full z-10 flex items-center justify-between px-4 py-3 bg-gradient-to-b from-black/80 to-transparent pointer-events-none">
    <div class="flex items-center gap-2 drop-shadow-md">
      <div class="w-2 h-2 rounded-full shadow-[0_0_8px_rgba(0,0,0,0.8)]"
        [ngClass]="{'bg-red-500 shadow-red-500/50': videoType === 'youtube', 'bg-blue-400 shadow-blue-400/50': videoType === 'vimeo', 'bg-emerald-400 shadow-emerald-400/50': videoType === 'local', 'bg-gray-500': videoType === 'none'}">
      </div>
      <span class="text-[10px] font-bold text-white/95 tracking-widest uppercase">
        {{ videoType === 'none' ? 'Preview' : videoType }}
      </span>
    </div>
  </div>

  <!-- Contenido -->
  <div class="flex-1 w-full h-full flex items-center justify-center bg-black min-h-[260px] relative">

    <!-- Placeholder cuando no hay video -->
    <div *ngIf="videoType === 'none'"
      class="flex flex-col items-center justify-center gap-4 text-center bg-[#111111] w-full h-full p-6 select-none">
      <div class="w-16 h-16 rounded-2xl bg-gray-800/40 border border-gray-700/30 flex items-center justify-center shadow-lg transition-transform duration-300 hover:scale-105">
        <i class="pi pi-play text-2xl text-emerald-500 drop-shadow-[0_0_8px_rgba(16,185,129,0.4)]"></i>
      </div>
      <div class="space-y-1.5">
        <h4 class="text-sm font-semibold text-gray-200 tracking-wide">Sin vista previa de video</h4>
        <p class="text-xs max-w-[240px] mx-auto text-gray-400 leading-relaxed font-normal">
          Sube un video o ingresa un enlace de YouTube/Vimeo para visualizarlo aquí.
        </p>
      </div>
    </div>

    <!-- YouTube / Vimeo iFrame -->
    <iframe title="Video preview" *ngIf="(videoType === 'youtube' || videoType === 'vimeo') && safeUrl" [src]="safeUrl"
      class="w-full h-full border-0 absolute inset-0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen>
    </iframe>

    <!-- Video nativo para local o links directos -->
    <video *ngIf="videoType === 'local' && localVideoUrl" [src]="localVideoUrl" controls
      class="w-full h-full object-contain absolute inset-0 bg-black outline-none">
      <track kind="captions" src="" srclang="es" label="Español">
    </video>

  </div>
</div>

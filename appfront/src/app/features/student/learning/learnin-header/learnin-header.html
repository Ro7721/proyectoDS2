<header class="course-header" style="position: relative;">
    <!-- Botón Volver -->
    <div style="position: absolute; top: 16px; left: 16px; z-index: 10;">
        <button type="button" (click)="goBack()" class="flex items-center gap-2 bg-black/30 hover:bg-black/50 text-white px-4 py-2 rounded-lg backdrop-blur-sm transition border-none cursor-pointer">
            <span class="material-icons" style="font-size: 18px;">arrow_back</span> Volver a mis cursos
        </button>
    </div>

    <div class="course-cover">
        <img alt="Portada" [src]="course.coverImage" [alt]="course.title">
        <div class="overlay"></div>
        <div class="header-content">
            <span class="category">{{ course.categoryName }}</span>
            <h1>{{ course.title }}</h1>
            <div class="teacher">
                <div class="avatar">{{ teacherInitials }}</div>
                <div>
                    <small>Instructor</small>
                    <strong>{{ course.teacherFullName }}</strong>
                </div>
            </div>
        </div>
    </div>

    <div class="course-info">
        <div class="card">
            <span class="material-icons">menu_book</span>
            <div>
                <strong>{{ course.totalLessons }}</strong>
                <small>Lecciones</small>
            </div>
        </div>
        <div class="card">
            <span class="material-icons">trending_up</span>
            <div>
                <strong>{{ course.totalProgress }}%</strong>
                <small>Progreso</small>
            </div>
        </div>
        <div class="card">
            <span class="material-icons">history</span>
            <div>
                <strong>{{ course.lastAccess | date:'dd MMM yyyy'}}</strong>
                <small>{{ course.lastAccess | date:'HH:mm' }}</small>
            </div>
        </div>
    </div>
</header>

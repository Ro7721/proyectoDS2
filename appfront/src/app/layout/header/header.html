<header
    class="bg-white/85 backdrop-blur-xl border-b border-gray-200 px-3 sm:px-4 md:px-6 py-3 md:py-4 flex items-center justify-between sticky top-0 z-30 shadow-sm">
    <div class="flex items-center gap-2 sm:gap-4 min-w-0">
        <p-button (click)="toggleSidebar()" [text]="true" severity="secondary" class="lg:hidden shrink-0"
            ariaLabel="Abrir menú">
            <i class="pi pi-bars text-xl"></i>
        </p-button>
        <h1 class="text-lg sm:text-xl md:text-2xl font-bold text-gray-900 truncate">{{ title }}</h1>
    </div>

    <div class="flex items-center gap-1.5 sm:gap-3 shrink-0">
        <p-button (click)="toggleTheme()" [text]="true" severity="secondary" [rounded]="true"
            [ariaLabel]="themeService.isDark() ? 'Activar modo claro' : 'Activar modo oscuro'">
            <i class="pi text-lg" [ngClass]="themeService.isDark() ? 'pi-sun' : 'pi-moon'"></i>
        </p-button>

        <p-button [text]="true" severity="secondary" [rounded]="true" ariaLabel="Notificaciones">
            <i class="pi pi-bell text-lg"></i>
        </p-button>

        <div
            class="flex items-center gap-2 sm:gap-3 hover:bg-gray-100 rounded-xl p-1.5 sm:p-2 cursor-pointer transition max-w-[52vw] sm:max-w-none">
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-gradient-to-br text-white grid place-items-center font-semibold shadow-sm shrink-0"
                [ngClass]="role === 'ROLE_TEACHER'? 'bg-purple-400 to-purple-600' : role === 'ROLE_ADMIN'? 'bg-red-400 to-red-600' : 'bg-green-400 to-green-600'">
                {{ initials }}
            </div>
            <div class="hidden sm:block min-w-0">
                <p class="text-sm font-semibold text-gray-800 truncate max-w-40 md:max-w-56">{{ userName }}</p>
                <p class="text-xs text-gray-500">
                    {{ role === 'ROLE_TEACHER'? 'Docente' : role === 'ROLE_ADMIN'? 'Administrador' : 'Alumno' }}
                </p>
            </div>
        </div>
    </div>
</header>
